[project]
name = "ecoa"
version = "0.1.0"
description = "Rede social estilo microblog com Django REST Framework"
authors = [
    {name = "Jonathan Carvalho",email = "jonathan2500@outlook.pt"}
]
requires-python = ">=3.15"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg (>=3.3.6,<4.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "black (>=26.10.1,<27.0.0)"
]
